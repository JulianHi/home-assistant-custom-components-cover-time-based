send_command:
  name: Send command
  description: Send a command (open_cover, close_cover, stop_cover) to a time based cover.
  fields:
    command:
      name: Command
      description: The command to be sent.
      example: open_cover
    device_id:
      name: Device ID
      description: ID of the cover device the command is sent to.
      example: room_rolling_shutter
